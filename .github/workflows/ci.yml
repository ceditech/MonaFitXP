# Minimal regression net: typecheck + unit tests on every push and PR.
# Deliberately no builds, no deploys, no secrets — those come in the
# production-readiness phase (EAS builds, source-map upload, etc.).
name: CI

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App — typecheck + jest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: WorkoutAssist/app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: WorkoutAssist/app/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npx jest --ci

  functions:
    name: Cloud Functions — build + jest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: WorkoutAssist/functions
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: WorkoutAssist/functions/package-lock.json
      - name: Install
        run: npm ci
      - name: Build (tsc)
        run: npm run build
      - name: Unit tests
        run: npm test
