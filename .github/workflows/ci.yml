# Regression net: typecheck + unit tests on every push and PR.
# Since 2026-07-21 this also deploys: a green push to main ships rules,
# indexes, functions and hosting to production. See the `deploy` job below,
# and docs/CI_CD.md for the one-time secret setup.
name: CI

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # Superseded test runs are cancelled, but never cancel an in-flight deploy —
  # a half-applied Firebase deploy is worse than a redundant one.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  app:
    name: App — typecheck + jest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: WorkoutAssist/app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: WorkoutAssist/app/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npx jest --ci

  functions:
    name: Cloud Functions — build + jest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: WorkoutAssist/functions
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: WorkoutAssist/functions/package-lock.json
      - name: Install
        run: npm ci
      - name: Build (tsc)
        run: npm run build
      - name: Unit tests
        run: npm test

  rules:
    name: Firestore rules — emulator tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: WorkoutAssist/functions
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: WorkoutAssist/functions/package-lock.json
      # The Firestore emulator is a Java process; firebase-tools requires JDK 21+.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install
        run: npm ci
      # Runs firestore.rules against the local emulator — no Firebase project,
      # no credentials, no billing. Guards owner-isolation, server-only metrics
      # (anti-cheat) and server-only entitlements (no self-granted Pro).
      - name: Security-rules tests
        run: npm run test:rules

  deploy:
    name: Deploy to Firebase (production)
    # Production is only ever reached through three green jobs.
    needs: [app, functions, rules]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # Declared so you can attach required reviewers in repo Settings →
    # Environments without touching this file.
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Build functions
        working-directory: WorkoutAssist/functions
        # Must build before deploying: there is no predeploy hook, so a stale
        # lib/ would ship silently.
        run: |
          npm ci
          npm run build

      - name: Build web bundle
        working-directory: WorkoutAssist/app
        # firebaseConfig.ts is compiled in (public by design) — no build secrets.
        run: |
          npm ci
          npx expo export -p web

      - name: Authenticate to Firebase
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        # Key is written under RUNNER_TEMP, outside the workspace, so no later
        # step or cache can pick it up. Removed again in the final step.
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT secret is not set — see docs/CI_CD.md"
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/gcp-key.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcp-key.json" >> "$GITHUB_ENV"

      - name: Deploy rules, indexes, functions, hosting
        working-directory: WorkoutAssist
        env:
          # The discovery handshake needs longer than the default 10s.
          FUNCTIONS_DISCOVERY_TIMEOUT: '120'
        run: |
          npx --yes firebase-tools@15 deploy \
            --only firestore:rules,firestore:indexes,functions,hosting \
            --project workoutassist-6e273 \
            --non-interactive \
            --force

      - name: Remove credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/gcp-key.json"
